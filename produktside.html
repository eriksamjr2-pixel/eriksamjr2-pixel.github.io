<!doctype html>
<html lang="no">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Produktside</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="style.css" rel="stylesheet" />
  </head>

  <body>
    <!-- TOPBAR -->

    <nav class="navbar navbar-expand-lg custom-navbar">
      <div class="container-fluid">
        <div class="d-flex align-items-center gap-4">
          <a class="nav-link custom-link" href="index.html">HJEM</a>
          <a class="nav-link custom-link" href="kontakt.html">KONTAKT</a>
          <a class="nav-link custom-link" href="butikk.html">PRODUKTER</a>
        </div>

        <h2 class="logo-text mb-0">STØT.NO</h2>

        <div class="d-flex align-items-center gap-2">
          <span class="custom-link">SØK</span>

          <input class="form-control search-box" type="text" />

          <button id="authOpenBtn" class="btn menu-btn">☰</button>
        </div>
      </div>
    </nav>

    <!-- SIDEBAR / LOGIN -->

    <aside id="authPanel" class="auth-panel" aria-hidden="true">
      <header
        class="p-3 border-bottom d-flex justify-content-between align-items-center"
      >
        <strong>Bruker</strong>

        <button id="authCloseBtn" class="btn btn-sm btn-outline-dark">
          Lukk
        </button>
      </header>

      <div class="p-3">
        <div id="authLoggedOut">
          <div class="d-flex gap-2 mb-3">
            <button class="btn btn-outline-dark active" data-tab="login">
              Logg inn
            </button>

            <button class="btn btn-outline-dark" data-tab="signup">
              Registrer
            </button>
          </div>

          <form id="loginForm" data-panel="login">
            <input
              class="form-control mb-2"
              type="email"
              id="loginEmail"
              placeholder="E-post"
            />

            <input
              class="form-control mb-3"
              type="password"
              id="loginPass"
              placeholder="Passord"
            />

            <button class="btn btn-dark w-100">Logg inn</button>

            <div id="loginMsg" class="small mt-2"></div>
          </form>

          <form id="signupForm" data-panel="signup" style="display: none">
            <input
              class="form-control mb-2"
              type="text"
              id="signupName"
              placeholder="Brukernavn"
            />

            <input
              class="form-control mb-2"
              type="text"
              id="signupClass"
              placeholder="Klasse"
            />

            <input
              class="form-control mb-2"
              type="email"
              id="signupEmail"
              placeholder="E-post"
            />

            <input
              class="form-control mb-3"
              type="password"
              id="signupPass"
              placeholder="Passord"
            />

            <button class="btn btn-dark w-100">Opprett profil</button>

            <div id="signupMsg" class="small mt-2"></div>
          </form>
        </div>

        <div id="authLoggedIn" style="display: none">
          <p id="whoami"></p>

          <div id="roleBadge"></div>

          <button id="logoutBtn" class="btn btn-outline-dark w-100">
            Logg ut
          </button>
        </div>
      </div>
    </aside>

    <!-- PRODUKTINFO -->

    <div class="midcontainer">
      <div class="midcolv">
        <div id="produktBilde" class="produktbilde">produktbilde</div>
      </div>
      <div class="midcolh">
        <div class="produktinfo">
          <h1 id="produktNavn" class="produktNavn">Produktnavn</h1>
          <p class="produktBeskrivelse">
            Lorem ipsum dolor sit amet, consectetur adipiscing elit. Donec a
            diam lectus. Sed sit amet ipsum mauris. Maecenas congue ligula ac
            quam viverra nec consectetur ante hendrerit. Donec et mollis dolor.
          </p>
          <h1 id="produktPris" class="produktPris">PRIS</h1>
          <button class="btn btn-dark">Kjøp nå</button>
        </div>
      </div>
    </div>
    <div class="bottomcontainer"></div>

    <script type="module" src="script.js"></script>
  </body>
</html>
